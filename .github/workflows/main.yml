name: Unpack & Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack any ZIP cleanly
        run: |
          ZIP_FILE=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unpacking $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d _unpacked
            rm -rf app cloudflare-tunnel-relay
            cp -r _unpacked/GeminiMcpPhoneAgent/* .
            rm -rf _unpacked *.zip
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Clean update to GeminiMcpPhoneAgent v2.0" || true
            git push || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GeminiMcpPhoneAgent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          
